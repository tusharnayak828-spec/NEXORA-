<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora | Professional Demo Suite</title>
<style>
:root{--bg:#09111f;--panel:#101d30;--panel2:#14243a;--line:#24364d;--text:#edf4ff;--muted:#91a4bd;--cyan:#52d6e8;--blue:#6c91ff;--green:#47d7a0;--amber:#f4bd65;--red:#ff7887}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#142e4c 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:26px 18px;border-right:1px solid var(--line);background:#091321;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:.2px}.logo{width:37px;height:37px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;color:#061321;font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:700}.navlabel{color:#6e829d;text-transform:uppercase;font-size:10px;letter-spacing:1.8px;margin:38px 10px 12px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#a9bad0;padding:12px;border-radius:10px;text-align:left;margin:4px 0}.nav button.active,.nav button:hover{background:#162b44;color:white}.nav .ico{width:22px;text-align:center;color:var(--cyan)}.sidefoot{position:absolute;bottom:22px;left:20px;right:20px;color:#6f839c;font-size:11px}.main{padding:28px clamp(18px,4vw,52px);max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.top h1{font-size:clamp(26px,3vw,36px);line-height:1.15;margin:7px 0}.sub{color:var(--muted);margin:0}.pill{border:1px solid #31506a;color:#a9c4dd;border-radius:99px;padding:7px 12px;font-size:11px;white-space:nowrap}.hero{padding:25px;border:1px solid #28445f;border-radius:18px;background:linear-gradient(120deg,#132a43,#102034 70%);margin-bottom:22px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h2{font-size:23px;margin:4px 0 8px}.hero p{color:#a7bad0;max-width:690px;margin:0}.hero-mark{font-size:40px;opacity:.9}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.metric,.card{background:linear-gradient(180deg,#122239,#0f1c2e);border:1px solid var(--line);border-radius:15px;padding:18px}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:27px;margin:7px 0 3px}.delta{font-size:11px;color:var(--green)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}.sectionhead h3{margin:0;font-size:16px}.btn{border:1px solid #35536e;background:#19314d;color:#eaf5ff;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:700}.btn.primary{background:linear-gradient(120deg,#55d7e7,#7798ff);color:#071321;border:0}.btn.ghost{background:transparent}.btn.danger{color:#ff9aa5;border-color:#633d4a;background:#2a1a29}.btn:disabled{opacity:.4;cursor:not-allowed}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:650px;background:#0e1b2c}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #20334a;font-size:12px}th{color:#8298b2;background:#122238;font-size:10px;text-transform:uppercase;letter-spacing:1px}td{color:#dce8f7}tr:last-child td{border:0}.status{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;background:#1c3d39;color:#69e0b1}.status.warn{background:#44351f;color:#ffd18a}.status.info{background:#203757;color:#9bc4ff}.status.bad{background:#462631;color:#ff9eaa}.two{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.barrow{display:grid;grid-template-columns:115px 1fr 45px;align-items:center;gap:10px;margin:14px 0;font-size:11px;color:#a7bad0}.bar{height:8px;border-radius:20px;background:#24364d;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:20px}.activity{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #20334a;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-top:5px;flex:none}.muted{color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;color:#9db0c8;font-size:11px;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #2b4059;border-radius:9px;background:#0a1727;color:#eef5ff;padding:10px 11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan)}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs button{background:#0d1b2d;border:1px solid var(--line);color:#9fb2c9;border-radius:8px;padding:8px 12px;font-size:11px}.tabs button.active{color:#071321;background:var(--cyan);border-color:var(--cyan)}.drop{border:1px dashed #45617d;border-radius:14px;padding:26px;text-align:center;background:#0c1a2b}.drop input{max-width:240px;color:#a8bdd4;font-size:11px}.notice{border-left:3px solid var(--amber);background:#2a251b;padding:11px 13px;border-radius:7px;color:#f4d59d;font-size:11px;margin:14px 0}.success{border-left-color:var(--green);background:#142b2a;color:#a7e8d0}.docfields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.docfields div{background:#0b1929;border:1px solid #253950;border-radius:9px;padding:11px}.docfields small{display:block;color:#8298b2;font-size:10px}.docfields strong{font-size:13px}.empty{text-align:center;padding:28px;color:#8196b0}.footer{color:#627790;font-size:10px;text-align:center;padding:25px 0}.mobilebar{display:none}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.shell{grid-template-columns:210px 1fr}}
@media(max-width:700px){.shell{display:block}.side{height:auto;position:relative;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}.sidefoot,.navlabel{display:none}.nav{display:flex;overflow:auto;gap:5px;margin-top:12px}.nav button{width:auto;white-space:nowrap;padding:9px 11px;font-size:11px}.main{padding:20px 14px}.hero{padding:18px}.hero-mark{display:none}.grid{gap:9px}.metric{padding:13px}.metric strong{font-size:22px}.top{align-items:flex-start}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><div class="logo">N</div><div>NEXORA<small>TECHNOLOGIES</small></div></div>
  <div class="navlabel">Demo workspaces</div>
  <nav class="nav">
    <button class="active" data-page="overview"><span class="ico">⌂</span>Overview</button>
    <button data-page="factory"><span class="ico">▦</span>FactoryOS</button>
    <button data-page="crm"><span class="ico">◎</span>ClientFlow CRM</button>
    <button data-page="docs"><span class="ico">▤</span>DocuMind AI</button>
  </nav>
  <div class="sidefoot">NEXORA TECHNOLOGIES<br>AI · SOFTWARE · AUTOMATION<br><br>Interactive concept demos · Sample data only</div>
</aside>
<main class="main" id="app"></main>
</div>
<script>
const seed={
 orders:[
  {id:"WO-2048",product:"Precision Valve Housing",customer:"Apex Industrial",qty:240,due:"2026-11-12",status:"In Production",progress:72},
  {id:"WO-2047",product:"Drive Coupling Set",customer:"Northstar Motors",qty:120,due:"2026-11-08",status:"Quality Check",progress:91},
  {id:"WO-2046",product:"Hydraulic Manifold",customer:"Mechline Systems",qty:80,due:"2026-11-15",status:"Scheduled",progress:18},
  {id:"WO-2045",product:"Mounting Bracket X2",customer:"Apex Industrial",qty:500,due:"2026-11-06",status:"Delayed",progress:46}
 ],
 leads:[
  {id:"NX-301",name:"Aarav Shah",company:"Patel Engineering Works",email:"aarav@example.com",value:185000,stage:"Qualified",owner:"Sales Team"},
  {id:"NX-302",name:"Mira Desai",company:"Orbit Logistics",email:"mira@example.com",value:95000,stage:"Proposal",owner:"Sales Team"},
  {id:"NX-303",name:"Rohan Mehta",company:"Vertex Components",email:"rohan@example.com",value:260000,stage:"New",owner:"Founder"},
  {id:"NX-304",name:"Nisha Patel",company:"BluePeak Realty",email:"nisha@example.com",value:125000,stage:"Negotiation",owner:"Founder"}
 ],
 docs:[]
};
function load(k){try{return JSON.parse(localStorage.getItem("nx_"+k))||structuredClone(seed[k])}catch(e){return structuredClone(seed[k])}}
let orders=load("orders"),leads=load("leads"),docs=load("docs"),page="overview";
const money=n=>"₹"+Number(n).toLocaleString("en-IN");
function save(){localStorage.setItem("nx_orders",JSON.stringify(orders));localStorage.setItem("nx_leads",JSON.stringify(leads));localStorage.setItem("nx_docs",JSON.stringify(docs))}
function status(s){let c=s==="Delayed"||s==="At Risk"?"bad":s==="Scheduled"||s==="New"?"info":s==="Proposal"||s==="Quality Check"?"warn":"";return `<span class="status ${c}">${s}</span>`}
function header(kicker,title,sub){return `<div class="top"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div><span class="pill">● LIVE DEMO · SAMPLE DATA</span></div>`}
function metric(label,value,delta){return `<div class="metric"><span>${label}</span><strong>${value}</strong><div class="delta">${delta}</div></div>`}
function render(){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 const app=document.getElementById("app");
 if(page==="overview")app.innerHTML=header("NEXORA SHOWCASE","Business systems, made practical.","Explore three connected concepts built around real operational workflows.")+
 `<div class="hero"><div><div class="eyebrow">BUILT FOR OPERATIONS-LED BUSINESSES</div><h2>From fragmented work to one clear view.</h2><p>Purpose-built software that helps teams track production, manage customer relationships and turn documents into structured business data.</p></div><div class="hero-mark">✦</div></div>
 <div class="grid">${metric("DEMO MODULES","03","Manufacturing · CRM · AI documents")}${metric("SAMPLE WORK ORDERS",orders.length,"Editable local demo records")}${metric("CRM PIPELINE",money(leads.reduce((a,x)=>a+x.value,0)),"Illustrative opportunity value")}${metric("DOCUMENTS PROCESSED",docs.length,"Demo workspace activity")}</div>
 <div class="sectionhead"><h3>Explore the three solutions</h3><span class="muted">Select a workspace</span></div>
 <div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
 <div class="card"><div class="eyebrow">01 / OPERATIONS</div><h2>FactoryOS</h2><p class="muted">Production orders, shop-floor progress, inventory signals and delivery risk.</p><button class="btn primary" onclick="go('factory')">Open demo →</button></div>
 <div class="card"><div class="eyebrow">02 / SALES</div><h2>ClientFlow CRM</h2><p class="muted">Lead tracking, pipeline visibility, ownership and follow-up discipline.</p><button class="btn primary" onclick="go('crm')">Open demo →</button></div>
 <div class="card"><div class="eyebrow">03 / AUTOMATION</div><h2>DocuMind AI</h2><p class="muted">A document intake concept that extracts key fields into reviewable records.</p><button class="btn primary" onclick="go('docs')">Open demo →</button></div></div>
 <div class="notice">These are Nexora demonstration concepts using fictional sample records. They are not production systems, customer deployments or verified client case studies.</div>`;
 if(page==="factory")renderFactory(app);
 if(page==="crm")renderCRM(app);
 if(page==="docs")renderDocs(app);
}
function renderFactory(app){
 app.innerHTML=header("DEMO 01 · MANUFACTURING","FactoryOS","A single operations view for work orders, production progress and delivery commitments.")+
 `<div class="grid">${metric("ACTIVE WORK ORDERS",orders.length,"Across all production stages")}${metric("UNITS IN PRODUCTION",orders.reduce((a,x)=>a+x.qty,0).toLocaleString("en-IN"),"Sample order quantities")}${metric("ON-TIME RISK",orders.filter(x=>x.status==="Delayed").length,"Orders requiring attention")}${metric("AVG. COMPLETION",Math.round(orders.reduce((a,x)=>a+x.progress,0)/Math.max(orders.length,1))+"%","Across sample work orders")}</div>
 <div class="two"><div class="card"><div class="sectionhead"><h3>Work order register</h3><button class="btn primary" onclick="addOrder()">+ New work order</button></div><div class="tablewrap"><table><thead><tr><th>Order</th><th>Product / Customer</th><th>Qty</th><th>Due date</th><th>Status</th><th>Progress</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.product}<br><span class="muted">${o.customer}</span></td><td>${o.qty}</td><td>${o.due}</td><td>${status(o.status)}</td><td><div style="min-width:90px">${o.progress}%<div class="bar"><i style="width:${o.progress}%"></i></div></div></td></tr>`).join("")}</tbody></table></div></div>
 <div class="card"><h3>Production stage mix</h3>${["Scheduled","In Production","Quality Check","Delayed"].map((s,i)=>{let n=orders.filter(o=>o.status===s).length;return `<div class="barrow"><span>${s}</span><div class="bar"><i style="width:${orders.length?n/orders.length*100:0}%"></i></div><b>${n}</b></div>`}).join("")}<div class="notice">Demo insight: delayed orders are flagged for review. A live system could connect this view to ERP, inventory and machine data.</div><h3>Recent activity</h3><div class="activity"><i class="dot"></i><div>WO-2048 moved to <b>72% complete</b><br><span class="muted">Production update · sample</span></div></div><div class="activity"><i class="dot"></i><div>WO-2047 awaiting <b>quality sign-off</b><br><span class="muted">Quality workflow · sample</span></div></div></div></div>
 <div class="actions"><button class="btn" onclick="exportCSV('orders')">Export work orders CSV</button><button class="btn ghost" onclick="resetData()">Reset sample data</button></div>`;
}
function renderCRM(app){
 app.innerHTML=header("DEMO 02 · CUSTOMER RELATIONSHIPS","ClientFlow CRM","A practical sales workspace for B2B teams managing leads, opportunities and next steps.")+
 `<div class="grid">${metric("OPEN OPPORTUNITIES",leads.length,"Active sample leads")}${metric("PIPELINE VALUE",money(leads.reduce((a,x)=>a+x.value,0)),"Illustrative deal value")}${metric("PROPOSALS",leads.filter(x=>x.stage==="Proposal").length,"Awaiting client response")}${metric("NEGOTIATIONS",leads.filter(x=>x.stage==="Negotiation").length,"Late-stage opportunities")}</div>
 <div class="card"><div class="sectionhead"><h3>Sales pipeline</h3><button class="btn primary" onclick="addLead()">+ Add lead</button></div><div class="tabs">${["All","New","Qualified","Proposal","Negotiation","Won"].map(t=>`<button class="${t==="All"?"active":""}" onclick="filterLeads('${t}',this)">${t}</button>`).join("")}</div><div class="tablewrap"><table><thead><tr><th>Lead / Company</th><th>Contact</th><th>Deal value</th><th>Stage</th><th>Owner</th><th>Update</th></tr></thead><tbody id="leadrows">${leadRows(leads)}</tbody></table></div></div>
 <div class="two" style="margin-top:15px"><div class="card"><h3>Pipeline by stage</h3>${["New","Qualified","Proposal","Negotiation","Won"].map(s=>{let v=leads.filter(x=>x.stage===s).reduce((a,x)=>a+x.value,0);let max=Math.max(1,...leads.map(x=>x.value));return `<div class="barrow"><span>${s}</span><div class="bar"><i style="width:${Math.min(100,v/(max*2)*100)}%"></i></div><b>${money(v)}</b></div>`}).join("")}</div><div class="card"><h3>Sales hygiene checklist</h3><div class="activity"><i class="dot"></i><div>Every lead has a named owner</div></div><div class="activity"><i class="dot"></i><div>Opportunity stages are visible</div></div><div class="activity"><i class="dot"></i><div>Deal values support forecasting</div></div><div class="activity"><i class="dot"></i><div>Next-action reminders can be added in a production build</div></div></div></div>
 <div class="actions"><button class="btn" onclick="exportCSV('leads')">Export leads CSV</button></div>`;
}
function leadRows(arr){return arr.map(l=>`<tr><td><b>${l.name}</b><br><span class="muted">${l.company}</span></td><td>${l.email}</td><td>${money(l.value)}</td><td>${status(l.stage)}</td><td>${l.owner}</td><td><select aria-label="Update stage" onchange="setStage('${l.id}',this.value)" style="background:#0a1727;color:#eaf5ff;border:1px solid #2b4059;border-radius:7px;padding:6px"><option ${l.stage==="New"?"selected":""}>New</option><option ${l.stage==="Qualified"?"selected":""}>Qualified</option><option ${l.stage==="Proposal"?"selected":""}>Proposal</option><option ${l.stage==="Negotiation"?"selected":""}>Negotiation</option><option ${l.stage==="Won"?"selected":""}>Won</option></select></td></tr>`).join("")}
function filterLeads(stage,btn){document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");document.getElementById("leadrows").innerHTML=leadRows(stage==="All"?leads:leads.filter(l=>l.stage===stage))}
function setStage(id,s){leads=leads.map(l=>l.id===id?{...l,stage:s}:l);save();renderCRM(document.getElementById("app"))}
function renderDocs(app){
 app.innerHTML=header("DEMO 03 · DOCUMENT AUTOMATION","DocuMind AI","Turn incoming business documents into structured, reviewable records.")+
 `<div class="grid">${metric("DOCUMENTS IN WORKSPACE",docs.length,"Stored in this browser")}${metric("REVIEW REQUIRED",docs.filter(d=>d.status==="Needs review").length,"Human verification queue")}${metric("APPROVED",docs.filter(d=>d.status==="Approved").length,"Reviewed demo records")}${metric("EXTRACTION MODE","SIMULATED","No external AI service connected")}</div>
 <div class="two"><div class="card"><h3>Document intake</h3><p class="muted">Upload a sample invoice, purchase order or plain-text document. This demo simulates an extraction result for review.</p><div class="drop"><div style="font-size:27px">⇧</div><b>Choose a document</b><p class="muted">PDF, TXT, CSV or image · sample workflow</p><input id="docfile" type="file" accept=".pdf,.txt,.csv,.png,.jpg,.jpeg"></div><div class="actions"><button class="btn primary" onclick="processDoc()">Run demo extraction</button></div><div class="notice">Important: this is a UI/workflow prototype. It does not perform OCR or call an AI model. A production version would connect secure file storage, OCR/LLM extraction, validation rules and human approval.</div></div>
 <div class="card"><h3>Suggested workflow</h3><div class="activity"><i class="dot"></i><div><b>1. Receive</b><br><span class="muted">Invoice, PO, delivery note or vendor form</span></div></div><div class="activity"><i class="dot"></i><div><b>2. Extract</b><br><span class="muted">Vendor, document number, date, totals and line items</span></div></div><div class="activity"><i class="dot"></i><div><b>3. Validate</b><br><span class="muted">Required fields, totals, duplicates and confidence</span></div></div><div class="activity"><i class="dot"></i><div><b>4. Approve & export</b><br><span class="muted">Human sign-off before ERP/accounting handoff</span></div></div></div></div>
 <div class="card" style="margin-top:15px"><div class="sectionhead"><h3>Extraction review queue</h3><button class="btn" onclick="exportCSV('docs')">Export records CSV</button></div>${docs.length?`<div class="tablewrap"><table><thead><tr><th>File</th><th>Document no.</th><th>Vendor</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>${docs.map((d,i)=>`<tr><td>${d.file}</td><td>${d.number}</td><td>${d.vendor}</td><td>${money(d.total)}</td><td>${status(d.status)}</td><td><button class="btn" onclick="approveDoc(${i})">${d.status==="Approved"?"Approved":"Approve"}</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No documents yet. Upload a sample file to start the demo workflow.</div>`}</div>`;
}
function go(p){page=p;render()}
function addOrder(){let product=prompt("Product / item name:");if(!product)return;let customer=prompt("Customer name:","Demo Customer")||"Demo Customer";let qty=Number(prompt("Quantity:","100"))||100;orders.unshift({id:"WO-"+(2050+orders.length),product,customer,qty,due:"2026-11-20",status:"Scheduled",progress:0});save();render()}
function addLead(){let name=prompt("Contact name:");if(!name)return;let company=prompt("Company:","New prospect")||"New prospect";let value=Number(prompt("Opportunity value in INR:","75000"))||75000;leads.unshift({id:"NX-"+(305+leads.length),name,company,email:"contact@example.com",value,stage:"New",owner:"Founder"});save();render()}
function processDoc(){let f=document.getElementById("docfile").files[0];if(!f){alert("Please choose a file first.");return}let name=f.name;let ext=name.split(".").pop().toLowerCase();let textContent="";if(ext==="txt"||ext==="csv"){let reader=new FileReader();reader.onload=()=>{textContent=String(reader.result).slice(0,4000);makeDoc(name,textContent)};reader.readAsText(f)}else makeDoc(name,"")}
function makeDoc(name,txt){let match=txt.match(/(?:total|amount)\s*[:=]?\s*(?:₹|INR)?\s*([\d,]+(?:\.\d{1,2})?)/i);let total=match?Number(match[1].replace(/,/g,"")):48250;let vendor=(txt.match(/(?:vendor|supplier)\s*[:=]\s*([^\n,]+)/i)||[])[1]||"Sample Industrial Supplies";let number=(txt.match(/(?:invoice|document)\s*(?:no|number|#)?\s*[:=]?\s*([A-Z0-9-]+)/i)||[])[1]||"INV-DEMO-1042";docs.unshift({file:name,number,vendor:vendor.trim(),total,status:"Needs review",extractedAt:new Date().toLocaleString("en-IN")});save();render()}
function approveDoc(i){docs[i].status="Approved";save();render()}
function exportCSV(which){let rows=which==="orders"?orders:which==="leads"?leads:docs;if(!rows.length){alert("No records to export.");return}let keys=Object.keys(rows[0]);let csv=[keys.join(","),...rows.map(r=>keys.map(k=>'"'+String(r[k]??"").replace(/"/g,'""')+'"').join(","))].join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="nexora-"+which+".csv";a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(!confirm("Reset all demo records to the original sample data?"))return;orders=structuredClone(seed.orders);leads=structuredClone(seed.leads);docs=[];save();render()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
render();
</script>
</body></html>
