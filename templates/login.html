<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora Admin Login</title><link rel="stylesheet" href="{{ url_for('static',filename='admin.css') }}"></head><body><main class="auth"><a class="brand" href="/">NEXORA <span>TECHNOLOGIES</span></a><h1>Admin sign in</h1><p>Private enquiry management portal.</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username</label><input name="username" required autocomplete="username"><label>Password</label><input type="password" name="password" required autocomplete="current-password"><button>Sign in securely</button></form><a href="/">← Back to website</a></main></body></html>
